[project]
name = "pipecat-quickstart"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "nltk<3.10.1",
    "pipecat-ai[anthropic,cartesia,daily,deepgram,elevenlabs,openai,runner,silero,webrtc]>=1.4.0",
    "pipecatcloud",
    "supabase>=2.31.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
